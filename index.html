<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .card {
            width: 500px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .role {
            color: #555;
            margin-bottom: 25px;
        }

        h2 {
            margin: 20px 0 10px;
            color: #333;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .skill {
            padding: 8px 14px;
            background: #e8f0fe;
            border-radius: 20px;
            font-size: 14px;
        }

        .message {
            margin-top: 30px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Samidha Wani</h1>

        <p class="role">
            Aspiring Cloud & DevOps Engineer
        </p>

        <h2>Skills</h2>

        <div class="skills">
            <span class="skill">AWS</span>
            <span class="skill">Linux</span>
            <span class="skill">Docker</span>
            <span class="skill">Kubernetes</span>
            <span class="skill">K3s</span>
            <span class="skill">Jenkins</span>
            <span class="skill">Git & GitHub</span>
        </div>

        <h2>What I'm Learning</h2>

        <p>
            Cloud infrastructure, containerization,
            Kubernetes deployments and CI/CD.
        </p>

        <div class="message">
            🚀 This application is deployed on K3s!
        </div>

    </div>

</body>
</html>
